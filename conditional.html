<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <script type ="text/javascript" >
       var age=20;
       if(age>=18){
        console.log("you are an adult");
       }
       else{
        console.log("you are a minor");
       }
       var grade ='a';
       document.write("entering switch block <br/>");
       switch(grade){
        case 'a': 
        document.write("good job");
        break;
        case 'b':
        document.write("pretty good");
        break;
        case 'c': 
        document.write("work hard");
        break;
        default: 
        document.write("invalid grade");
       }
    </script>
</body>
